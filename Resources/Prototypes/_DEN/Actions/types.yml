- type: entity
  parent: BaseAction
  id: ActionToggleClothingSeals
  name: Toggle Clothing Seals
  description: Toggle the seals on your suit, or stop in-progress sealing.
  components:
  - type: Action
    itemIconStyle: BigItem
    useDelay: 1
  - type: InstantAction
    event: !type:ToggleSealableControllerEvent

- type: entity
  parent: BaseAction
  id: ActionOpenModsuitUI
  name: Open MODsuit Controller UI
  description: Opens the MODsuit Controller UI.
  components:
  - type: Action
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ModsuitControllerOpenUiEvent

- type: entity
  parent: BaseToggleAction
  id: ActionToggleModsuitModule
  name: Toggle Modsuit Module
  description: Toggles the modsuit module.
  components:
  - type: Action
    itemIconStyle: BigItem

- type: entity
  parent: BaseAction
  id: ActionModsuitBikeHorn
  name: Bike Horn Module
  description: Honks that bike horn!
  components:
  - type: Action
    useDelay: 0.5
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ActivateUsingActionEvent
  - type: ModsuitPowerDrainAction
    drainOnAction: 1.0

- type: entity
  parent: BaseAction
  id: ActionRetractableItemModsuitDrill
  name: Modsuit Drill
  description: Deploy the contained drill from your MODsuit
  components:
  - type: Action
    useDelay: 2
    raiseOnAction: true
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Tools/handdrill.rsi
      state: handdrill
  - type: InstantAction
    event: !type:OnRetractableItemActionEvent
  - type: RetractableItemAction
    spawnedPrototype: ModsuitMiningDrill
    summonSounds:
      collection: Drill
    retractSounds:
      collection: Drill

- type: entity
  parent: BaseAction
  id: ActionHealthAnalyzerScan
  name: Modsuit Health Analyzer Scan
  description: Use the scanner built into your modsuit gauntlets to read something's vitals.
  components:
  - type: Action
    useDelay: 1
    icon: { sprite: _DEN/Objects/ModsuitModules/modules.rsi, state: health_module }
    iconOn: { sprite: _DEN/Objects/ModsuitModules/modules.rsi, state: health_module }
    itemIconStyle: BigAction
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:InteractUsingActionEvent
  - type: ModsuitPowerDrainAction
    drainOnAction: 2.5

- type: entity
  parent: BaseAction
  id: ActionInjectorUse
  name: Modsuit Injector
  description: Use the injector build into your modsuit gauntlets to draw or inject from a target.
  components:
  - type: Action
    useDelay: 0.25
    icon: { sprite: _DEN/Objects/ModsuitModules/modules.rsi, state: injector_module }
    iconOn: { sprite: _DEN/Objects/ModsuitModules/modules.rsi, state: injector_module }
    itemIconStyle: BigAction
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - Bloodstream
      - DrawableSolution
    event: !type:InteractUsingActionEvent
  - type: ModsuitPowerDrainAction
    drainOnAction: 1.5
  - type: ContainerExamineRelay

- type: entity
  parent: BaseAction
  id: ActionDefibrillatorUse
  name: Modsuit Defibrillator
  description: Use the defibrillator paddles integrated into your MODsuit gauntlets to shock the target.
  components:
  - type: Action
    useDelay: 3.0
    icon: { sprite: _DEN/Objects/ModsuitModules/modules.rsi, state: defibrillator }
    iconOn: { sprite: _DEN/Objects/ModsuitModules/modules.rsi, state: defibrillator }
    itemIconStyle: BigAction
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
        - Bloodstream
        - DrawableSolution
    event: !type:InteractUsingActionEvent
  - type: ModsuitPowerDrainAction
    drainOnAction: 100
  - type: ContainerExamineRelay

- type: entity
  parent: BaseAction
  id: ActionKinesisUse
  name: Modsuit Kinesis Module
  description: Use the kinesis module of your MODsuit gauntlets.
  components:
  - type: Action
    useDelay: 1.0
    icon: { sprite: _DEN/Objects/ModsuitModules/modules.rsi, state: kinesismodule }
    iconOn: { sprite: _DEN/Objects/ModsuitModules/modules.rsi, state: kinesismodule }
    itemIconStyle: BigAction
  - type: TargetAction
    range: 0
    checkCanAccess: false
  - type: EntityTargetAction
    event: null
  - type: WorldTargetAction
    event: !type:InteractInWorldActionEvent
  - type: ModsuitPowerDrainAction
    drainOnAction: 3.5