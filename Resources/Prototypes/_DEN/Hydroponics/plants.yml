- type: entity
  parent: BasePlant
  id: EveryspicePlants
  name: everyspice plant
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Hydroponics/everyspice.rsi
  - type: PlantData
    name: seeds-everyspice-name
    packetPrototype: EveryspiceSeeds
    productPrototypes: [ FoodEveryspice ]
  - type: Plant
    lifespan: 25
    maturation: 6
    production: 6
    yield: 2
    potency: 20
  - type: PlantAtmospheric
    highHeatTolerance: 303 # ~30°C
  - type: PlantHarvest
    harvestRepeat: Repeat
  - type: PlantChemicals
    chemicals:
      Everyspice:
        min: 1
        max: 10
        potencyDivisor: 10

- type: entity
