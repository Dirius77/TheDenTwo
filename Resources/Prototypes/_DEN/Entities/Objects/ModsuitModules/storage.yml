- type: entity
  parent: ModsuitModuleBase
  id: ModsuitStorageModuleBluespace
  name: bluespace storage module
  description: A storage module utilizing bluespace technology.
  components:
    - type: Sprite
      sprite: _DEN/Objects/ModsuitModules/modules.rsi
      layers:
        - state: bluespace_storage
    - type: Module
      busWidth: 4
      texture: "/Textures/_DEN/Interface/Modules/module-width-4.png"
      siblingBlacklist:
        tags:
          - StorageModule
    - type: Tag
      tags:
        - StorageModule
    - type: ModsuitStorageModule
      storageComponent:
        - type: Storage
          grid:
            - 0,0,19,9
      maxItemSize: Huge

