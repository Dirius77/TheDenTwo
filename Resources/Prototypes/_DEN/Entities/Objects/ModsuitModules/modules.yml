- type: entity
  abstract: true
  parent: BaseItem
  id: BaseModsuitModule
  components:
  - type: Module
  - type: ModsuitModule

- type: entity
  abstract: true
  parent: BaseModsuitModule
  id: ModsuitModuleWidth1
  components:
  - type: Item
    size: Small
  - type: Module
    busWidth: 1
    texture: "/Textures/_DEN/Interface/Modules/module-width-1.png"

- type: entity
  abstract: true
  parent: BaseModsuitModule
  id: ModsuitModuleWidth2
  components:
  - type: Item
    size: Normal
  - type: Module
    busWidth: 2
    texture: "/Textures/_DEN/Interface/Modules/module-width-2.png"

- type: entity
  abstract: true
  parent: BaseModsuitModule
  id: ModsuitModuleWidth3
  components:
  - type: Item
    size: Large
  - type: Module
    busWidth: 3
    texture: "/Textures/_DEN/Interface/Modules/module-width-3.png"
      
- type: entity
  abstract: true
  parent: BaseModsuitModule
  id: ModsuitModuleWidth4
  components:
  - type: Item
    size: Huge
  - type: Module
    busWidth: 4
    texture: "/Textures/_DEN/Interface/Modules/module-width-4.png"

- type: entity
  abstract: true
  id: ModsuitModuleTogglePower
  components:
  - type: ModuleTogglePowerDraw
  - type: ItemToggle
    onUse: false
    onActivate: false
  - type: ModulePowerDraw

- type: entity
  parent: ModsuitModuleWidth2
  id: ModsuitModuleBrokenWidth2
  name: broken module
  description: This module is cracked clean through and no longer functions...
  components:
  - type: Sprite
    sprite: Objects/Materials/Scrap/generic.rsi
    layers:
    - state: glass-1
  - type: Module
    texture: "/Textures/_DEN/Interface/Modules/module-width-2-broken.png"
  - type: Tag
    tags:
    - Trash

- type: entity
  parent: ModsuitModuleWidth2
  id: ModsuitModuleEmpProtection
  name: emp protection module
  description: A module which will absorb the charge from an EMP in order to prevent it causing physical damage to the MODsuit. Only works once.
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
    - state: empshield_module
  - type: ModsuitEmpProtectionModule
    broken: ModsuitModuleBrokenWidth2

- type: entity
  parent: ModsuitModuleWidth1
  id: ModsuitModuleEatingApparatus
  name: eating apparatus module
  description: A module which projects a barrier in front of the mouth, allowing for eating while retaining pressure and atmosphere protection.
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
    - state: apparatus
  - type: ModsuitPartAttachedModule
    slots:
    - head
  - type: ModsuitPassiveComponentModule
    blockOnSeal:
    - type: IngestionBlocker

- type: entity
  parent: ModsuitModuleWidth2
  id: ModsuitModuleArmorBooster
  name: armor booster module
  description: A collection of armored plates that greatly increase the defensive capabilities of the modsuit, but prevent it from sealing enough to protect the user from the vacuum of space.
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
    - state: armorbooster
  - type: Module
    siblingBlacklist:
      tags:
      - ArmorModule
  - type: Tag
    tags:
    - ArmorModule
  - type: ModsuitPartAttachedModule
    slots:
    - head
    - outerClothing
  - type: ModsuitArmorModule
    slotModifiers:
      outerClothing:
        coefficients:
          Blunt: 0.6
          Slash: 0.6
          Piercing: 0.6
          Heat: 0.8
          Caustic: 0.7
      head:
        coefficients:
          Blunt: 0.9
          Slash: 0.9
          Piercing: 0.9
          Heat: 0.9
  - type: ModsuitExplosionResistanceModule
    slotCoefficients:
      outerClothing: 0.6
      head: 0.9
  - type: ModsuitPassiveComponentModule
    blockOnSeal:
    - type: PressureProtection
    - type: TemperatureProtection

- type: entity
  parent: ModsuitModuleWidth1
  id: ModsuitModuleElectricalInsulation
  name: electrical insulation module
  description: A module which allows the modsuit gloves to be insulated against electrical shocks while sealed.
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
    - state: quickcarry
  - type: ModsuitPartAttachedModule
    slots:
    - gloves
  - type: ModsuitPassiveComponentModule
    addOnSeal:
    - type: Insulated

- type: entity
  parent: ModsuitModuleWidth4
  id: ModsuitModuleHolster
  name: holster module
  description: A module which allows the modsuit to store items worn in suit storage internally when retracted.
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
    - state: holster_module
  - type: ModsuitPartAttachedModule
    slots:
    - outerClothing
  - type: ModsuitHolsterModule
  - type: ModulePowerDraw
    drawRate: 0.0
    useCharge: 5.0

- type: entity
  parent: [ ModsuitModuleWidth2, ModsuitModuleTogglePower ]
  id: ModsuitModuleNoSlip
  name: no slip module
  description: A module which provides the modsuit boots incredible grip, preventing slipping.
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
    - state: noslip
  - type: ModulePowerDraw
    drawRate: 0.2
  - type: ModsuitPartAttachedModule
    slots:
    - shoes
  - type: ModsuitModuleTogglePartComponents
    addOnToggle:
    - type: NoSlip

- type: entity
  parent: [ModsuitModuleWidth2, ModsuitModuleTogglePower]
  id: ModsuitModuleRadiationShielding
  name: radiation shielding module
  description: A module which allows the modsuit to block radiation from reaching the wearer. Requires a deployed chestplate.
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
    - state: radshield_module
  - type: ModsuitPartAttachedModule
    slots:
    - outerClothing
  - type: ModulePowerDraw
    drawRate: 0.1
  - type: ModsuitArmorModule
    modifiers:
      coefficients:
        Radiation: 0.0

- type: entity
  parent: [ModsuitModuleWidth1, ModsuitModuleTogglePower]
  id: ModsuitModuleThermalRegulator
  name: thermal regulator module
  description: A module which allows the modsuit to insulate the user from extreme temperatures and fire.
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
      - state: regulator_module
  - type: ModsuitPartAttachedModule
    needsAll: false
    slots:
    - outerClothing
    - head
  - type: ModulePowerDraw
    drawRate: 0.3
  - type: ModsuitModuleTogglePartComponents
    addOnToggle:
    - type: TemperatureProtection
      heatingCoefficient: 0.01
      coolingCoefficient: 0.01
    - type: FireProtection
      reduction: 0.8

- type: entity
  parent: [ModsuitModuleWidth2, ModsuitModuleTogglePower]
  id: ModsuitModuleMagneticStabilizer
  name: magnetic stabilizer module
  description: A module containing powerful electromagnets which integrate with the modsuit's boots.
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
    - state: magnet_module
  - type: Module
    siblingBlacklist:
      tags:
      - MagbootModule
  - type: Tag
    tags:
    - MagbootModule
  - type: ModulePowerDraw
    drawRate: 0.5
  - type: ModsuitModuleActionGrant
    actions: 
    - ActionToggleModsuitModule
  - type: ModsuitModuleTogglePart
  - type: ModsuitPartAttachedModule
    slots:
    - shoes
  - type: ModsuitPassiveComponentModule
    addOnSeal:
    - type: ItemToggle
      onUse: false
      onActivate: false
    - type: Magboots
    - type: ClothingSpeedModifier
      walkModifier: 0.8
      sprintModifier: 0.8

- type: entity
  parent: [ModsuitModuleWidth1, ModsuitModuleTogglePower]
  id: ModsuitModuleFlashlight
  name: flashlight module
  description: A module that installs a powerful flashlight on the modsuit helmet.
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
    - state: flashlight_module
  - type: ModulePowerDraw
    drawRate: 0.3
  - type: ModsuitModuleActionGrant
    actions: 
    - ActionToggleModsuitModule
  - type: ModsuitPartAttachedModule
    slots:
    - head
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: false
    radius: 5
    energy: 3
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true

- type: entity
  parent: [ModsuitModuleWidth1]
  id: ModsuitModuleBikeHorn
  name: bike horn module
  description: A module that installs a bike horn into your MODsuit controller.
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
    - state: honk_module
  - type: ModsuitModuleActionGrant
    actions: 
    - ActionModsuitBikeHorn
  - type: ModsuitPartAttachedModule
    slots:
    - back
  - type: ActivateUsingAction
  - type: UseDelay
    delay: 0.5
  - type: EmitSoundOnUse
    sound: &SoundBikeHorn
      collection: BikeHorn
      params:
        variation: 0.125
  - type: EmitSoundOnLand
    sound: *SoundBikeHorn
  - type: EmitSoundOnActivate
    sound: *SoundBikeHorn
  - type: EmitSoundOnCollide
    sound: *SoundBikeHorn

- type: entity
  parent: [ModsuitModuleWidth2]
  id: ModsuitModuleHealthAnalyzer
  name: health analyzer module
  description: A module that provides a built in health analyzer in the modsuits gauntlets for reading the vitals of patients.
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
    - state: health_module
  - type: ModsuitPartAttachedModule
    slots:
    - gloves
  - type: InteractUsingAction
  - type: ModsuitModuleActionGrant
    actions: 
    - ActionHealthAnalyzerScan
  - type: HealthAnalyzer
  - type: UserInterface
    interfaces:
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface

- type: entity
  parent: [ModsuitModuleWidth1]
  id: ModsuitModuleInjector
  name: injector module
  description: A module that provides a jet injector built into the wrist of the MODsuit's gauntlets.
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
    - state: injector_module
  - type: ModsuitPartAttachedModule
    slots:
    - gloves
  - type: ModsuitRelayVerbs
  - type: ModsuitModuleActionGrant
    actions: 
    - ActionInjectorUse
  - type: InteractUsingAction
  - type: UseDelay
    delay: 1.5
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 15
  - type: RelayedSolutionExamine
    solution: hypospray
  - type: ExaminableSolution
    solution: hypospray
    exactVolume: true
  - type: Spillable
    solution: hypospray
  - type: Injector
    solutionName: hypospray
    ignoreClosed: false
    currentTransferAmount: null
    activeModeProtoId: ModsuitInjectorDynamicMode
    allowedModes:
    - ModsuitInjectorDynamicMode
    - ModsuitInjectorInjectMode

- type: entity
  parent: [ ModsuitModuleWidth2 ]
  id: ModsuitModuleDefibrillator
  name: defibrillator module
  description: A module that integrates defibrillator paddles into the hands of the MODsuit gauntlets.
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
    - state: defibrillator
  - type: ModsuitPartAttachedModule
    slots:
    - gloves
  - type: InteractUsingAction
  - type: ModsuitModuleActionGrant
    actions: 
    - ActionDefibrillatorUse
  - type: UseDelay
    delay: 3.0
  - type: ItemToggle
    onUse: false
    onActivate: false
  - type: Defibrillator
    zapHeal:
      types:
        Asphyxiation: -40

- type: entity
  parent: [ ModsuitModuleWidth2, ModsuitModuleTogglePower ]
  id: ModsuitModuleKinesis
  name: kinesis module
  description: A module that allows the user to project 
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
    - state: kinesismodule
  - type: ModsuitPartAttachedModule
    slots:
    - gloves
  - type: InteractInWorldAction
  - type: ModsuitModuleActionGrant
    actions: 
    - ActionKinesisUse
  - type: UseDelay
    delay: 3.0
  - type: ItemToggle
    onUse: false
    onActivate: false
  - type: ModulePowerDraw
    drawRate: 1.5
  - type: ForceGun
    frequency: 15
    dampingRatio: 4
    massLimit: 50
    lineColor: "#18a2d5"
    soundLaunch:
      path: /Audio/Weapons/soup.ogg
      params:
        volume: 2

- type: entity
  parent: MiningDrill
  id: ModsuitMiningDrill
  name: modsuit mining drill
  description: The collapsable drill from a MODsuit module, consumes power on use.
  categories: [HideSpawnMenu]
  components:
  - type: ConsumeModsuitPowerOnMelee
    drainOnMelee: 1.0

- type: entity
  parent: [ModsuitModuleWidth2]
  id: ModsuitModuleMiningDrill
  name: drill module
  description: A module that incorporates a collapsible drill into the MODsuit for mining.
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
    - state: drill_module
  - type: ModsuitModuleActionGrant
    actions: 
    - ActionRetractableItemModsuitDrill
  - type: ModsuitPartAttachedModule
    slots:
    - gloves

- type: entity
  parent: [ModsuitModuleWidth4, ModsuitModuleTogglePower]
  id: ModsuitModuleCloak
  name: cloaking module
  description: An advanced module which allows the user to become invisible.
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
    - state: advancedcloak
  - type: ModsuitPartAttachedModule
    slots:
    - outerClothing
    - head
  - type: ModulePowerDraw
    drawRate: 2.0
  - type: ModsuitModuleToggleParentComponents
    addOnToggle:
    - type: Stealth
      minVisibility: 0.1
      lastVisibility: 0.1

- type: entity
  parent: [ModsuitModuleWidth1, ModsuitModuleTogglePower]
  id: ModsuitModuleGPS
  name: gps module
  description: A module which adds a built-in gps to the modsuit controller.
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
    - state: gps_module
  - type: ModsuitPartAttachedModule
    slots:
    - back
  - type: ModulePowerDraw
    drawRate: 0.2
  - type: ModsuitModuleTogglePartComponents
    addOnToggle:
    - type: HandheldGPS

- type: entity
  parent: [ModsuitModuleWidth1, ModsuitModuleTogglePower]
  id: ModsuitModuleMedicalVisor
  name: medical visor module
  description: A module which provides a built in medical hud to the modsuit helmet.
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
    - state: medhud_visor
  - type: ModsuitPartAttachedModule
    slots:
    - head
  - type: ModulePowerDraw
    drawRate: 0.3
  - type: ModsuitModuleTogglePartComponents
    addOnToggle:
    - type: ShowHealthBars
    - type: ShowHealthIcons

- type: entity
  parent: [ModsuitModuleWidth1, ModsuitModuleTogglePower]
  id: ModsuitModuleDiagnosticVisor
  name: diagnostic visor module
  description: A module which provides a built in diagnostic hud to the modsuit helmet.
  components:
  - type: Sprite
    sprite: _DEN/Objects/ModsuitModules/modules.rsi
    layers:
    - state: diaghud_visor
  - type: ModsuitPartAttachedModule
    slots:
