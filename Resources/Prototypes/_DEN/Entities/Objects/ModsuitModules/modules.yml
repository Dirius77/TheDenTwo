  - type: ModsuitModuleTogglePartComponents
    addOnToggle:
    - type: MiningScanner
      range: 10

- type: entity
  parent: [ModsuitModuleWidth1, ModsuitModuleTogglePower]
  id: ModsuitModuleTrayScanner
  name: t-ray scanner visor module
