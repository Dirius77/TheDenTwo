- type: entity
  abstract: true
  parent: FoodInjectableBase
  id: FoodJellyBase
  name: jelly
  description: A dessert made of jiggly, sweet jelly.
  components:
  - type: FlavorProfile
    flavors:
    - jelly
  - type: Sprite
    sprite: _DEN/Objects/Consumable/Food/jelly.rsi
    state: jelly
  - type: Solution
    solution:
      reagents:
      - ReagentId: GellingAgent
        Quantity: 5
      - ReagentId: Sugar
        Quantity: 10
  - type: Edible
    utensil:
    - Fork
    - Spoon
  - type: Tag
    tags:
    - Jelly

- type: entity
  abstract: true
  parent: FoodJellyBase
  id: FoodFruitJellyBase
  components:
  - type: Tag
    tags:
    - Jelly
    - Fruit

- type: entity
  parent: FoodJellyBase
  id: FoodJellyColorful
  suffix: Random Color
  components:
  - type: Sprite
    layers:
    - state: jelly_color_red
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        jelly_color_red: ""
        jelly_color_orange: ""
        jelly_color_yellow: ""
        jelly_color_green: ""
        jelly_color_blue: ""
        jelly_color_purple: ""

