# Magic spray paints

- type: entity
  parent: SprayPaintCan
  id: SprayPaintCanMagic
  name: magic spray paint
  components:
  - type: RecolorApplier
    recolorData:
      color: white
      paintType: *paintType
      shaderBlacklist: *blacklist
  - type: RecolorApplierColorSelector
  - type: ActivatableUI
    blockSpectators: true
    inHandsOnly: true
    singleUser: true
    verbText: verb-recolor-applier-color-selector-openui #fuck you i can make it as long as i want
    key: enum.RecolorApplierColorSelectorKey.Key
  - type: UserInterface
    interfaces:
      enum.RecolorApplierColorSelectorKey.Key:
        type: RecolorApplierColorSelectorBui
  - type: Sprite
    layers:
    - state: spray-can-base
      map: ["Base"]
    - state: spray-can-rainbow-closed
      map: ["enum.OpenableVisuals.Layer"]
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "spray-can-rainbow-open"}
          False: {state: "spray-can-rainbow-closed"}

- type: entity
