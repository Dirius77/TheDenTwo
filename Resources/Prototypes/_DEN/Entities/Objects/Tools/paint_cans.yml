- type: entity
  parent: BaseItem
  id: SprayPaintCan
  abstract: true
  description: A can of high quality spray paint with patented anti-skin technology.
  components:
  - type: Appearance
  - type: Sprite
    sprite: _DEN/Objects/Tools/spray-paint.rsi
    state: spray-can-base
  - type: Openable
    closeable: true
    sound:
      path: /Audio/Effects/pop_high.ogg
    closeSound:
      path: /Audio/Effects/pop_high.ogg
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: RecolorApplier # The important one\
    recolorData:
      color: white
      paintType: &paintType spray paint
      shaderBlacklist: &blacklist
      - unshaded
      - DisplacedDraw
    entityBlacklist:
      components:
      - HumanoidProfile # Prevent spraying on humans
      - Puddle # It's a liquid lol
      - Cable # For accessibility reasons.
      - CableVisualizer # See above
      - AtmosPipeColor # It doesn't work currently, unsure why? Possibly because gaspipecolor visualizer runs first.
      - PipeColorVisuals # See above
      - AttachedClothing # So you can't spray paint just the hood of a hoodie / hardsuit helmet. because I HATE YOU.
    maxUses: 64 # Might be too much? Unsure.

# Rainbow colors

- type: entity
  parent: SprayPaintCan
  id: SprayPaintCanRed
  name: red spray paint
  components:
  - type: RecolorApplier
    recolorData:
      color: red
      colorName: red
      paintType: *paintType
      shaderBlacklist: *blacklist
  - type: Sprite
    layers:
    - state: spray-can-base
      map: ["Base"]
    - state: spray-can-color-closed
      map: ["enum.OpenableVisuals.Layer"]
      color: red
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "spray-can-color-open" , color: red}
          False: {state: "spray-can-color-closed" , color: red}

