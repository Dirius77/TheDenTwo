- type: entity
  abstract: true
  parent: [ClothingHeadBase]
  id: ClothingHeadMantisBase
  components:
  - type: Tag
    tags:
    - WhitelistChameleon
    - MantisBeltStorable

- type: entity
  parent: [ClothingHeadMantisBase, BaseFoldable] # ClothingHeadTinfoil doesn't exist oops! removed until an implimentation for insulation is added.
  id: ClothingHeadHatFezMantisInsulative
  name: insulative mantis fez
  description: "Someone wrapped your old mantis fez in mu-metal foil... Oh well. At least it'll protect you from psionic attacks. The slouch can be folded to either side."
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Head/Hats/mantis_fez_insulative.rsi
    layers:
    - state: icon
      map: ["unfoldedLayer"]
    - state: icon-flipped
      map: ["foldedLayer"]
      visible: false
  - type: Clothing
    sprite: _DEN/Clothing/Head/Hats/mantis_fez_insulative.rsi
#  - type: GuideHelp # commented out until psionics and guides are implimented
#    guides: [ PsionicInsulation ]
  - type: Foldable
    canFoldInsideContainer: true
    foldVerbText: fold-flip-verb
    unfoldVerbText: fold-flip-verb
  - type: FoldableClothing
    foldedEquippedPrefix: flipped

- type: entity
  parent: [ClothingHeadMantisBase, BaseFoldable]
  id: ClothingHeadHatFezMantisAiry
  name: airy mantis fez
  description: "A modest cap decorated with a thick tassle that can be worn over either eye. But it must be worn over an eye, as tradition dictates."
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Head/Hats/mantis_fez_airy.rsi
    layers:
    - state: icon
      map: ["unfoldedLayer"]
    - state: icon-flipped
      map: ["foldedLayer"]
      visible: false
  - type: Clothing
    sprite: _DEN/Clothing/Head/Hats/mantis_fez_airy.rsi
  - type: Foldable
    canFoldInsideContainer: true
    foldVerbText: fold-flip-verb
    unfoldVerbText: fold-flip-verb
  - type: FoldableClothing
    foldedEquippedPrefix: flipped

- type: entity
  parent: [ClothingHeadMantisBase, BaseFoldable]
  id: ClothingHeadHatFezMantisOrnate
  name: ornate mantis fez
  description: "A structured cap with a chained veil that can be folded up and out of the way, if you have no taste. Or perhaps there's something else covering your eyes already? You're sure it's fine."
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Head/Hats/mantis_fez_ornate.rsi
    layers:
    - state: icon
      map: ["unfoldedLayer"]
    - state: icon-folded
      map: ["foldedLayer"]
      visible: false
  - type: Clothing
    sprite: _DEN/Clothing/Head/Hats/mantis_fez_ornate.rsi
  - type: Foldable
    canFoldInsideContainer: true
    foldVerbText: fold-verb
    unfoldVerbText: unfold-verb
  - type: FoldableClothing
    foldedEquippedPrefix: folded

- type: entity # So chameleon clothes can select the folded sprite
  parent: ClothingHeadHatFezMantisOrnate
  id: ClothingHeadHatFezMantisOrnateFolded
  suffix: Folded
  components:
  - type: Foldable
    folded: true
  - type: Clothing
    equippedPrefix: folded

- type: entity
  parent: [ClothingHeadMantisBase, BaseMantisContraband] # Insultaive headcages dont exist so im making this the primary one. Add insulative base when it's added in.
  id: ClothingHeadCageMantis # This version has a chain on the front to match the other ClothingBackpackCoffinMantis items
  name: graven headcage
  description: "A durable mu-metal cage with a heavy chain, designed to insulate the mind of whoever wears it. Removal takes time and attention."
  components:
  - type: Item
    sprite: _DEN/Clothing/Head/Hats/cagemantis.rsi
    storedRotation: 0
  - type: Sprite
    sprite: _DEN/Clothing/Head/Hats/cagemantis.rsi
  - type: Clothing
    sprite: _DEN/Clothing/Head/Hats/cagemantis.rsi
    equipDelay: 0.5
    unequipDelay: 10
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.95
        Radiation: 0.95
#  - type: HeadCage # component doesnt exist yet lol
  - type: Tag
    tags:
    - MantisBeltStorable
    - MantisBoxRestraintsStorable
#  - type: GuideHelp # commented out until psionics and guides are implimented
#    guides: [ PsionicInsulation ]
