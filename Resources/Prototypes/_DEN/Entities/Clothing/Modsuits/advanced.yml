- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitAdvanced
  name: advanced modsuit control
  description: The controller for a advanced model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/advanced.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetAdvanced
      gloves: ClothingModsuitGauntletsAdvanced
      outerClothing: ClothingModsuitChestplateAdvanced
      shoes: ClothingModsuitBootsAdvanced
  - type: ModuleStorage
    maxBusWidth: 15

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsAdvanced
  categories: [ HideSpawnMenu ]
  name: advanced modsuit gauntlets
  description: A pair of gauntlets from a advanced MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/advanced.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/advanced.rsi

- type: entity
  parent: ClothingModsuitHelmetBaseExo
  id: ClothingModsuitHelmetAdvanced
  categories: [ HideSpawnMenu ]
  name: advanced modsuit helmet
  description: A helmet from a advanced MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Head/advanced.rsi
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: SealableClothingVisuals
    clothingVisuals:
      head:
      - state: equipped-HELMET-sealed
      - state: equipped-HELMET-visor
        shader: unshaded
        color: "DarkOrange"
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Head/advanced.rsi

- type: entity
  parent: ClothingModsuitChestplateBaseExo
  id: ClothingModsuitChestplateAdvanced
  categories: [ HideSpawnMenu ]
  name: advanced modsuit chestplate
  description: A chestplate from a advanced MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/OuterClothing/advanced.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/OuterClothing/advanced.rsi

- type: entity
  parent: ClothingModsuitBootsBase
  id: ClothingModsuitBootsAdvanced
  categories: [ HideSpawnMenu ]
  name: advanced modsuit boots
  description: A pair of boots from a advanced MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Shoes/advanced.rsi
    layers:
    - state: boots
    - state: boots-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Shoes/advanced.rsi
