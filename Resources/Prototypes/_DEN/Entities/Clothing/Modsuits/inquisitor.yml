- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitInquisitor
  name: inquisitor modsuit control
  description: The controller for a inquisitor model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/inquisitor.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetInquisitor
      gloves: ClothingModsuitGauntletsInquisitor
      outerClothing: ClothingModsuitChestplateInquisitor
      shoes: ClothingModsuitBootsInquisitor
  - type: ModuleStorage
    maxBusWidth: 15

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsInquisitor
  categories: [ HideSpawnMenu ]
  name: inquisitor modsuit gauntlets
  description: A pair of gauntlets from a inquisitor MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/inquisitor.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/inquisitor.rsi

- type: entity
  parent: ClothingModsuitHelmetBaseExo
  id: ClothingModsuitHelmetInquisitor
  categories: [ HideSpawnMenu ]
  name: inquisitor modsuit helmet
  description: A helmet from a inquisitor MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Head/inquisitor.rsi
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: SealableClothingVisuals
    clothingVisuals:
      head:
      - state: equipped-HELMET-sealed
      - state: equipped-HELMET-visor
        shader: unshaded
        color: "Cyan"
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Head/inquisitor.rsi

- type: entity
  parent: ClothingModsuitChestplateBaseExo
  id: ClothingModsuitChestplateInquisitor
  categories: [ HideSpawnMenu ]
  name: inquisitor modsuit chestplate
  description: A chestplate from a inquisitor MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/OuterClothing/inquisitor.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/OuterClothing/inquisitor.rsi

- type: entity
  parent: ClothingModsuitBootsBase
  id: ClothingModsuitBootsInquisitor
  categories: [ HideSpawnMenu ]
  name: inquisitor modsuit boots
  description: A pair of boots from a inquisitor MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Shoes/inquisitor.rsi
    layers:
    - state: boots
    - state: boots-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Shoes/inquisitor.rsi
