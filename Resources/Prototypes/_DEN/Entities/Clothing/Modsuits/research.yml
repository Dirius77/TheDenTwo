- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitResearch
  name: research modsuit control
  description: The controller for a research model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/research.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetResearch
      gloves: ClothingModsuitGauntletsResearch
      outerClothing: ClothingModsuitChestplateResearch
      shoes: ClothingModsuitBootsResearch
  - type: ModuleStorage
    maxBusWidth: 20

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsResearch
  categories: [ HideSpawnMenu ]
  name: research modsuit gauntlets
  description: A pair of gauntlets from a research MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/research.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/research.rsi

