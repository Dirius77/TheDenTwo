- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitDebug
  name: debug modsuit control
  description: The controller for a debug model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/debug.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetDebug
      gloves: ClothingModsuitGauntletsDebug
      outerClothing: ClothingModsuitChestplateDebug
      shoes: ClothingModsuitBootsDebug
  - type: ModuleStorage
    maxBusWidth: 50

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsDebug
  categories: [ HideSpawnMenu ]
  name: debug modsuit gauntlets
  description: A pair of gauntlets from a debug MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/debug.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/debug.rsi

- type: entity
  parent: ClothingModsuitHelmetBaseExo
  id: ClothingModsuitHelmetDebug
  categories: [ HideSpawnMenu ]
  name: debug modsuit helmet
  description: A helmet from a debug MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Head/debug.rsi
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: SealableClothingVisuals
    clothingVisuals:
      head:
      - state: equipped-HELMET-sealed
      - state: equipped-HELMET-visor
        shader: unshaded
        color: "Cyan"
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Head/debug.rsi

- type: entity
  parent: ClothingModsuitChestplateBaseExo
  id: ClothingModsuitChestplateDebug
  categories: [ HideSpawnMenu ]
  name: debug modsuit chestplate
  description: A chestplate from a debug MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/OuterClothing/debug.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/OuterClothing/debug.rsi

- type: entity
  parent: ClothingModsuitBootsBase
  id: ClothingModsuitBootsDebug
  categories: [ HideSpawnMenu ]
  name: debug modsuit boots
  description: A pair of boots from a debug MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Shoes/debug.rsi
    layers:
    - state: boots
    - state: boots-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Shoes/debug.rsi
