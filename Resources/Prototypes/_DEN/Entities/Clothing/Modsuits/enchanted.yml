- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitEnchanted
  name: enchanted modsuit control
  description: The controller for a enchanted model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/enchanted.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetEnchanted
      gloves: ClothingModsuitGauntletsEnchanted
      outerClothing: ClothingModsuitChestplateEnchanted
      shoes: ClothingModsuitBootsEnchanted
  - type: ModuleStorage
    maxBusWidth: 10

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsEnchanted
  categories: [ HideSpawnMenu ]
  name: enchanted modsuit gauntlets
  description: A pair of gauntlets from a enchanted MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/enchanted.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/enchanted.rsi

- type: entity
  parent: ClothingModsuitHelmetBaseExo
  id: ClothingModsuitHelmetEnchanted
  categories: [ HideSpawnMenu ]
  name: enchanted modsuit helmet
  description: A helmet from a enchanted MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Head/enchanted.rsi
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: SealableClothingVisuals
    clothingVisuals:
      head:
      - state: equipped-HELMET-sealed
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Head/enchanted.rsi

- type: entity
  parent: ClothingModsuitChestplateBaseExo
  id: ClothingModsuitChestplateEnchanted
  categories: [ HideSpawnMenu ]
  name: enchanted modsuit chestplate
  description: A chestplate from a enchanted MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/OuterClothing/enchanted.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/OuterClothing/enchanted.rsi

- type: entity
  parent: ClothingModsuitBootsBase
  id: ClothingModsuitBootsEnchanted
  categories: [ HideSpawnMenu ]
  name: enchanted modsuit boots
  description: A pair of boots from a enchanted MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Shoes/enchanted.rsi
    layers:
    - state: boots
    - state: boots-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Shoes/enchanted.rsi
