- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitHonkerative
  name: honkerative modsuit control
  description: The controller for a honkerative model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/honkerative.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetHonkerative
      gloves: ClothingModsuitGauntletsHonkerative
      outerClothing: ClothingModsuitChestplateHonkerative
      shoes: ClothingModsuitBootsHonkerative
  - type: ModuleStorage
    maxBusWidth: 15

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsHonkerative
  categories: [ HideSpawnMenu ]
  name: honkerative modsuit gauntlets
  description: A pair of gauntlets from a honkerative MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/honkerative.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/honkerative.rsi

