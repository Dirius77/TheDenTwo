- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitLoader
  name: loader modsuit control
  description: The controller for a loader model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/loader.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetLoader
      gloves: ClothingModsuitGauntletsLoader
      outerClothing: ClothingModsuitChestplateLoader
      shoes: ClothingModsuitBootsLoader
  - type: ModuleStorage
    maxBusWidth: 10

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsLoader
  categories: [ HideSpawnMenu ]
  name: loader modsuit gauntlets
  description: A pair of gauntlets from a loader MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/loader.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/loader.rsi

- type: entity
  parent: ClothingModsuitHelmetBase
  id: ClothingModsuitHelmetLoader
  categories: [ HideSpawnMenu ]
  name: loader modsuit helmet
  description: A helmet from a loader MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Head/loader.rsi
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: SealableClothingVisuals
    clothingVisuals:
      head:
      - state: equipped-HELMET-sealed
      - state: equipped-HELMET-visor
        shader: unshaded
        color: "Cyan"
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Head/loader.rsi

- type: entity
  parent: ClothingModsuitChestplateBase
  id: ClothingModsuitChestplateLoader
  categories: [ HideSpawnMenu ]
  name: loader modsuit chestplate
  description: A chestplate from a loader MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/OuterClothing/loader.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/OuterClothing/loader.rsi

- type: entity
  parent: ClothingModsuitBootsBase
  id: ClothingModsuitBootsLoader
  categories: [ HideSpawnMenu ]
  name: loader modsuit boots
  description: A pair of boots from a loader MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Shoes/loader.rsi
    layers:
    - state: boots
    - state: boots-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Shoes/loader.rsi
