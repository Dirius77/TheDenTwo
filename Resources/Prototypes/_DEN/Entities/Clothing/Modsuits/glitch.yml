- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitGlitch
  name: glitch modsuit control
  description: The controller for a glitch model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/glitch.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetGlitch
      gloves: ClothingModsuitGauntletsGlitch
      outerClothing: ClothingModsuitChestplateGlitch
      shoes: ClothingModsuitBootsGlitch
  - type: ModuleStorage
    maxBusWidth: 18

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsGlitch
  categories: [ HideSpawnMenu ]
  name: glitch modsuit gauntlets
  description: A pair of gauntlets from a glitch MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/glitch.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/glitch.rsi

- type: entity
  parent: ClothingModsuitHelmetBaseExo
  id: ClothingModsuitHelmetGlitch
  categories: [ HideSpawnMenu ]
  name: glitch modsuit helmet
  description: A helmet from a glitch MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Head/glitch.rsi
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: SealableClothingVisuals
    clothingVisuals:
      head:
      - state: equipped-HELMET-sealed
      - state: equipped-HELMET-visor
        shader: unshaded
        color: "Cyan"
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Head/glitch.rsi

- type: entity
  parent: ClothingModsuitChestplateBaseExo
  id: ClothingModsuitChestplateGlitch
  categories: [ HideSpawnMenu ]
  name: glitch modsuit chestplate
  description: A chestplate from a glitch MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/OuterClothing/glitch.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/OuterClothing/glitch.rsi

- type: entity
  parent: ClothingModsuitBootsBase
  id: ClothingModsuitBootsGlitch
  categories: [ HideSpawnMenu ]
  name: glitch modsuit boots
  description: A pair of boots from a glitch MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Shoes/glitch.rsi
    layers:
    - state: boots
    - state: boots-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Shoes/glitch.rsi
