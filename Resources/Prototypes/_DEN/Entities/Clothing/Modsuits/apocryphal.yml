- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitApocryphal
  name: apocryphal modsuit control
  description: The controller for a apocryphal model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/apocryphal.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetApocryphal
      gloves: ClothingModsuitGauntletsApocryphal
      outerClothing: ClothingModsuitChestplateApocryphal
      shoes: ClothingModsuitBootsApocryphal
  - type: ModuleStorage
    maxBusWidth: 25

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsApocryphal
  categories: [ HideSpawnMenu ]
  name: apocryphal modsuit gauntlets
  description: A pair of gauntlets from a apocryphal MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/apocryphal.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/apocryphal.rsi

- type: entity
  parent: ClothingModsuitHelmetBaseExo
  id: ClothingModsuitHelmetApocryphal
  categories: [ HideSpawnMenu ]
  name: apocryphal modsuit helmet
  description: A helmet from a apocryphal MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Head/apocryphal.rsi
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: SealableClothingVisuals
    clothingVisuals:
      head:
      - state: equipped-HELMET-sealed
      - state: equipped-HELMET-visor
        shader: unshaded
        color: "Cyan"
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Head/apocryphal.rsi

- type: entity
  parent: ClothingModsuitChestplateBaseExo
  id: ClothingModsuitChestplateApocryphal
  categories: [ HideSpawnMenu ]
  name: apocryphal modsuit chestplate
  description: A chestplate from a apocryphal MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/OuterClothing/apocryphal.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/OuterClothing/apocryphal.rsi

- type: entity
  parent: ClothingModsuitBootsBase
  id: ClothingModsuitBootsApocryphal
  categories: [ HideSpawnMenu ]
  name: apocryphal modsuit boots
  description: A pair of boots from a apocryphal MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Shoes/apocryphal.rsi
    layers:
    - state: boots
    - state: boots-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Shoes/apocryphal.rsi
