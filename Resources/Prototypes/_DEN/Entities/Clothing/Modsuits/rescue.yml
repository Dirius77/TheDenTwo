- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitRescue
  name: rescue modsuit control
  description: The controller for a rescue model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/rescue.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetRescue
      gloves: ClothingModsuitGauntletsRescue
      outerClothing: ClothingModsuitChestplateRescue
      shoes: ClothingModsuitBootsRescue
  - type: ModuleStorage
    maxBusWidth: 15

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsRescue
  categories: [ HideSpawnMenu ]
  name: rescue modsuit gauntlets
  description: A pair of gauntlets from a rescue MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/rescue.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/rescue.rsi

- type: entity
  parent: ClothingModsuitHelmetBaseExo
  id: ClothingModsuitHelmetRescue
  categories: [ HideSpawnMenu ]
  name: rescue modsuit helmet
  description: A helmet from a rescue MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Head/rescue.rsi
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: SealableClothingVisuals
    clothingVisuals:
      head:
      - state: equipped-HELMET-sealed
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Head/rescue.rsi

- type: entity
  parent: ClothingModsuitChestplateBaseExo
  id: ClothingModsuitChestplateRescue
  categories: [ HideSpawnMenu ]
  name: rescue modsuit chestplate
  description: A chestplate from a rescue MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/OuterClothing/rescue.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/OuterClothing/rescue.rsi

- type: entity
  parent: ClothingModsuitBootsBase
  id: ClothingModsuitBootsRescue
  categories: [ HideSpawnMenu ]
  name: rescue modsuit boots
  description: A pair of boots from a rescue MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Shoes/rescue.rsi
    layers:
    - state: boots
    - state: boots-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Shoes/rescue.rsi
