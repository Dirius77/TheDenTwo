- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitCivilian
  name: civilian modsuit control
  description: The controller for a civilian model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/civilian.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetCivilian
      gloves: ClothingModsuitGauntletsCivilian
      outerClothing: ClothingModsuitChestplateCivilian
      shoes: ClothingModsuitBootsCivilian
  - type: ModuleStorage
    maxBusWidth: 12

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsCivilian
  categories: [ HideSpawnMenu ]
  name: civilian modsuit gauntlets
  description: A pair of gauntlets from a civilian MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/civilian.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/civilian.rsi

