- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitNinja
  name: ninja modsuit control
  description: The controller for a ninja model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/ninja.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetNinja
      gloves: ClothingModsuitGauntletsNinja
      outerClothing: ClothingModsuitChestplateNinja
      shoes: ClothingModsuitBootsNinja
  - type: ModuleStorage
    maxBusWidth: 15

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsNinja
  categories: [ HideSpawnMenu ]
  name: ninja modsuit gauntlets
  description: A pair of gauntlets from a ninja MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/ninja.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/ninja.rsi

