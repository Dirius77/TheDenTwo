- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitAtmospheric
  name: atmospheric modsuit control
  description: The controller for a atmospheric model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/atmospheric.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetAtmospheric
      gloves: ClothingModsuitGauntletsAtmospheric
      outerClothing: ClothingModsuitChestplateAtmospheric
      shoes: ClothingModsuitBootsAtmospheric
  - type: ModuleStorage
    maxBusWidth: 15

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsAtmospheric
  categories: [ HideSpawnMenu ]
  name: atmospheric modsuit gauntlets
  description: A pair of gauntlets from a atmospheric MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/atmospheric.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/atmospheric.rsi

