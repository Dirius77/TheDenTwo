- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitChrono
  name: chrono modsuit control
  description: The controller for a chrono model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/chrono.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetChrono
      gloves: ClothingModsuitGauntletsChrono
      outerClothing: ClothingModsuitChestplateChrono
      shoes: ClothingModsuitBootsChrono
  - type: ModuleStorage
    maxBusWidth: 18

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsChrono
  categories: [ HideSpawnMenu ]
  name: chrono modsuit gauntlets
  description: A pair of gauntlets from a chrono MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/chrono.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/chrono.rsi

