- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitSyndicate
  name: syndicate modsuit control
  description: The controller for a syndicate model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/syndicate.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetSyndicate
      gloves: ClothingModsuitGauntletsSyndicate
      outerClothing: ClothingModsuitChestplateSyndicate
      shoes: ClothingModsuitBootsSyndicate
  - type: ModuleStorage
    maxBusWidth: 15

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsSyndicate
  categories: [ HideSpawnMenu ]
  name: syndicate modsuit gauntlets
  description: A pair of gauntlets from a syndicate MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/syndicate.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/syndicate.rsi

