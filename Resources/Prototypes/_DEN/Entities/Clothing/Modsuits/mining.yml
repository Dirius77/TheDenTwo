- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitMining
  name: mining modsuit control
  description: The controller for a mining model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/mining.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetMining
      gloves: ClothingModsuitGauntletsMining
      outerClothing: ClothingModsuitChestplateMining
      shoes: ClothingModsuitBootsMining
  - type: ModuleStorage
    maxBusWidth: 13

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsMining
  categories: [ HideSpawnMenu ]
  name: mining modsuit gauntlets
  description: A pair of gauntlets from a mining MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/mining.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/mining.rsi

