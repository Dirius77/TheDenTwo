- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitAsteroid
  name: asteroid modsuit control
  description: The controller for a asteroid model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/asteroid.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetAsteroid
      gloves: ClothingModsuitGauntletsAsteroid
      outerClothing: ClothingModsuitChestplateAsteroid
      shoes: ClothingModsuitBootsAsteroid
  - type: ModuleStorage
    maxBusWidth: 15

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsAsteroid
  categories: [ HideSpawnMenu ]
  name: asteroid modsuit gauntlets
  description: A pair of gauntlets from a asteroid MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/asteroid.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/asteroid.rsi

- type: entity
  parent: ClothingModsuitHelmetBaseExo
  id: ClothingModsuitHelmetAsteroid
  categories: [ HideSpawnMenu ]
  name: asteroid modsuit helmet
  description: A helmet from a asteroid MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Head/asteroid.rsi
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: SealableClothingVisuals
    clothingVisuals:
      head:
      - state: equipped-HELMET-sealed
      - state: equipped-HELMET-visor
        shader: unshaded
        color: "Cyan"
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Head/asteroid.rsi

- type: entity
  parent: ClothingModsuitChestplateBaseExo
  id: ClothingModsuitChestplateAsteroid
  categories: [ HideSpawnMenu ]
  name: asteroid modsuit chestplate
  description: A chestplate from a asteroid MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/OuterClothing/asteroid.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/OuterClothing/asteroid.rsi

- type: entity
  parent: ClothingModsuitBootsBase
  id: ClothingModsuitBootsAsteroid
  categories: [ HideSpawnMenu ]
  name: asteroid modsuit boots
  description: A pair of boots from a asteroid MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Shoes/asteroid.rsi
    layers:
    - state: boots
    - state: boots-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Shoes/asteroid.rsi
