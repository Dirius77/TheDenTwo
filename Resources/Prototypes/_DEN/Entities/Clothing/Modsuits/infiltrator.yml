- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitInfiltrator
  name: infiltrator modsuit control
  description: The controller for a infiltrator model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/infiltrator.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetInfiltrator
      gloves: ClothingModsuitGauntletsInfiltrator
      outerClothing: ClothingModsuitChestplateInfiltrator
      shoes: ClothingModsuitBootsInfiltrator
  - type: ModuleStorage
    maxBusWidth: 15

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsInfiltrator
  categories: [ HideSpawnMenu ]
  name: infiltrator modsuit gauntlets
  description: A pair of gauntlets from a infiltrator MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/infiltrator.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/infiltrator.rsi

- type: entity
  parent: ClothingModsuitHelmetBaseExo
  id: ClothingModsuitHelmetInfiltrator
  categories: [ HideSpawnMenu ]
  name: infiltrator modsuit helmet
  description: A helmet from a infiltrator MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Head/infiltrator.rsi
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: SealableClothingVisuals
    clothingVisuals:
      head:
      - state: equipped-HELMET-sealed
      - state: equipped-HELMET-visor
        shader: unshaded
        color: "Orange"
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Head/infiltrator.rsi

- type: entity
  parent: ClothingModsuitChestplateBaseExo
  id: ClothingModsuitChestplateInfiltrator
  categories: [ HideSpawnMenu ]
  name: infiltrator modsuit chestplate
  description: A chestplate from a infiltrator MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/OuterClothing/infiltrator.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/OuterClothing/infiltrator.rsi

- type: entity
  parent: ClothingModsuitBootsBase
  id: ClothingModsuitBootsInfiltrator
  categories: [ HideSpawnMenu ]
  name: infiltrator modsuit boots
  description: A pair of boots from a infiltrator MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Shoes/infiltrator.rsi
    layers:
    - state: boots
    - state: boots-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Shoes/infiltrator.rsi
