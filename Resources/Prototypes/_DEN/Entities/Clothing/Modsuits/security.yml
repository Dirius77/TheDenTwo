- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitSecurity
  name: security modsuit control
  description: The controller for a security model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/security.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetSecurity
      gloves: ClothingModsuitGauntletsSecurity
      outerClothing: ClothingModsuitChestplateSecurity
      shoes: ClothingModsuitBootsSecurity
  - type: ModuleStorage
    maxBusWidth: 15

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsSecurity
  categories: [ HideSpawnMenu ]
  name: security modsuit gauntlets
  description: A pair of gauntlets from a security MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/security.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/security.rsi

- type: entity
  parent: ClothingModsuitHelmetBaseExo
