- type: entity
  parent: [Clothing, ContentsExplosionResistanceBase]
  id: ClothingModsuitStandard
  name: standard modsuit control
  description: The controller for a standard model MODsuit.
  components:
    - type: Sprite
      sprite: _DEN/Clothing/Modsuits/Back/standard.rsi
      layers:
        - state: control
        - state: control-sealed
          visible: false
          shader: unshaded
          map: [ "sealedLayer" ]
    - type: Item
      size: Huge
    - type: Clothing
      quickEquip: false
      slots:
        - back
    - type: ContainerContainer
      containers:
        toggleable-clothing: !type:Container {}
    - type: ToggleableClothing
      requiredSlot:
        - back
      clothingPrototypes:
        head: ClothingModsuitHelmetStandard
        gloves: ClothingModsuitGauntletsStandard
        outerClothing: ClothingModsuitChestplateStandard
        shoes: ClothingModsuitBootsStandard
    - type: SealableClothing
      clothingVisuals:
        back:
          - state: equipped-BACKPACK-sealed
            shader: unshaded
    - type: SealableController
      controlledSlots: [ back, gloves, head, outerClothing, shoes ]
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.SealableClothingVisuals.State:
          sealedLayer:
            True: { visible: true }
            False: { visible: false }
    - type: WiresPanel
    - type: Wires
      boardName: wires-board-name-modsuit-control
      layoutId: ModControl
    - type: UserInterface
      interfaces:
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface
        enum.ModsuitModuleUiKey.Key:
          type: ModsuitModulesBoundUserInterface
    - type: ModsuitControl
      maxBusWidth: 15

- type: entity
  parent: ClothingHandsBase
  id: ClothingModsuitGauntletsStandard
  name: standard modsuit gauntlets
  description: A pair of gauntlets from a standard MODsuit.
  components:
    - type: FingerprintMask
    - type: Sprite
      sprite: _DEN/Clothing/Modsuits/Hands/standard.rsi
      layers:
        - state: gauntlets
        - state: gauntlets-sealed
          visible: false
          shader: unshaded
          map: [ "sealedLayer" ]
    - type: Clothing
      sprite: _DEN/Clothing/Modsuits/Hands/standard.rsi
    - type: SealableClothing
      clothingVisuals:
        gloves:
          - state: equipped-HAND-sealed
            shader: unshaded
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.SealableClothingVisuals.State:
          sealedLayer:
            True: { visible: true }
            False: { visible: false }
    - type: Tag
      tags:
        - WhitelistChameleon

- type: entity
  parent: ClothingHeadBase
  id: ClothingModsuitHelmetStandard
  name: standard modsuit helmet
  description: A helmet from a standard MODsuit.
  components:
    - type: Sprite
      sprite: _DEN/Clothing/Modsuits/Head/standard.rsi
      layers:
        - state: helmet
        - state: helmet-sealed
          visible: false
          shader: unshaded
          map: [ "sealedLayer" ]
    - type: Clothing
      sprite: _DEN/Clothing/Modsuits/Head/standard.rsi
    - type: SealableClothing
      clothingVisuals:
        head:
          - state: equipped-HEAD-sealed
            shader: unshaded
      sealedAddComponents:
        - type: BreathMask
        - type: IngestionBlocker
        - type: IdentityBlocker
        - type: PressureProtection
          highPressureMultiplier: 0.3
          lowPressureMultiplier: 1000
        - type: TemperatureProtection
          heatingCoefficient: 0.1
          coolingCoefficient: 0.1
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.SealableClothingVisuals.State:
          sealedLayer:
            True: { visible: true }
            False: { visible: false }
    - type: Tag
      tags:
        - WhitelistChameleon

