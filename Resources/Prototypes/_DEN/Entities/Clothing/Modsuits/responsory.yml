- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitResponsory
  name: responsory modsuit control
  description: The controller for a responsory model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/responsory.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetResponsory
      gloves: ClothingModsuitGauntletsResponsory
      outerClothing: ClothingModsuitChestplateResponsory
      shoes: ClothingModsuitBootsResponsory
  - type: ModuleStorage
    maxBusWidth: 15

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsResponsory
  categories: [ HideSpawnMenu ]
  name: responsory modsuit gauntlets
  description: A pair of gauntlets from a responsory MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/responsory.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/responsory.rsi

