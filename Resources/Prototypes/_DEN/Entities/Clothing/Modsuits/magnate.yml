- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitMagnate
  name: magnate modsuit control
  description: The controller for a magnate model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/magnate.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetMagnate
      gloves: ClothingModsuitGauntletsMagnate
      outerClothing: ClothingModsuitChestplateMagnate
      shoes: ClothingModsuitBootsMagnate
  - type: ModuleStorage
    maxBusWidth: 20

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsMagnate
  categories: [ HideSpawnMenu ]
  name: magnate modsuit gauntlets
  description: A pair of gauntlets from a magnate MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/magnate.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/magnate.rsi

