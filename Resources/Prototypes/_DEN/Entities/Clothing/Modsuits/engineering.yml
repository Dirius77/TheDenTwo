- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitEngineering
  name: engineering modsuit control
  description: The controller for a engineering model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/engineering.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetEngineering
      gloves: ClothingModsuitGauntletsEngineering
      outerClothing: ClothingModsuitChestplateEngineering
      shoes: ClothingModsuitBootsEngineering
  - type: ModuleStorage
    maxBusWidth: 15

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsEngineering
  categories: [ HideSpawnMenu ]
  name: engineering modsuit gauntlets
  description: A pair of gauntlets from a engineering MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/engineering.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/engineering.rsi

- type: entity
  parent: ClothingModsuitHelmetBaseExo
  id: ClothingModsuitHelmetEngineering
  categories: [ HideSpawnMenu ]
  name: engineering modsuit helmet
  description: A helmet from a engineering MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Head/engineering.rsi
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: SealableClothingVisuals
    clothingVisuals:
      head:
      - state: equipped-HELMET-sealed
      - state: equipped-HELMET-visor
        shader: unshaded
        color: "Cyan"
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Head/engineering.rsi

- type: entity
  parent: ClothingModsuitChestplateBaseExo
  id: ClothingModsuitChestplateEngineering
  categories: [ HideSpawnMenu ]
  name: engineering modsuit chestplate
  description: A chestplate from a engineering MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/OuterClothing/engineering.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/OuterClothing/engineering.rsi

- type: entity
  parent: ClothingModsuitBootsBase
  id: ClothingModsuitBootsEngineering
  categories: [ HideSpawnMenu ]
  name: engineering modsuit boots
  description: A pair of boots from a engineering MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Shoes/engineering.rsi
    layers:
    - state: boots
    - state: boots-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Shoes/engineering.rsi
