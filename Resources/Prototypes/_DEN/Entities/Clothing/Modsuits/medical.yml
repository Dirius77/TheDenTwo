    sprite: _DEN/Clothing/Modsuits/Head/medical.rsi
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Head/medical.rsi

- type: entity
  parent: ClothingModsuitChestplateBaseExo
  id: ClothingModsuitChestplateMedical
  categories: [ HideSpawnMenu ]
  name: medical modsuit chestplate
  description: A chestplate from a medical MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/OuterClothing/medical.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
