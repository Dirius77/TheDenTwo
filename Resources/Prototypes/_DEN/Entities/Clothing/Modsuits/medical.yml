- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitMedical
  name: medical modsuit control
  description: The controller for a medical model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/medical.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetMedical
      gloves: ClothingModsuitGauntletsMedical
      outerClothing: ClothingModsuitChestplateMedical
      shoes: ClothingModsuitBootsMedical
  - type: ModuleStorage
    maxBusWidth: 15

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsMedical
  categories: [ HideSpawnMenu ]
  name: medical modsuit gauntlets
  description: A pair of gauntlets from a medical MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/medical.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/medical.rsi

- type: entity
  parent: ClothingModsuitHelmetBaseExo
  id: ClothingModsuitHelmetMedical
  categories: [ HideSpawnMenu ]
  name: medical modsuit helmet
  description: A helmet from a medical MODsuit. TODO
  components:
