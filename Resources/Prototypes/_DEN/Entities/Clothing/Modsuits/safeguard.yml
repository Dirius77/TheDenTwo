- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitSafeguard
  name: safeguard modsuit control
  description: The controller for a safeguard model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/safeguard.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetSafeguard
      gloves: ClothingModsuitGauntletsSafeguard
      outerClothing: ClothingModsuitChestplateSafeguard
      shoes: ClothingModsuitBootsSafeguard
  - type: ModuleStorage
    maxBusWidth: 15

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsSafeguard
  categories: [ HideSpawnMenu ]
  name: safeguard modsuit gauntlets
  description: A pair of gauntlets from a safeguard MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/safeguard.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/safeguard.rsi

