- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitInterdyne
  name: interdyne modsuit control
  description: The controller for a interdyne model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/interdyne.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetInterdyne
      gloves: ClothingModsuitGauntletsInterdyne
      outerClothing: ClothingModsuitChestplateInterdyne
      shoes: ClothingModsuitBootsInterdyne
  - type: ModuleStorage
    maxBusWidth: 15

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsInterdyne
  categories: [ HideSpawnMenu ]
  name: interdyne modsuit gauntlets
  description: A pair of gauntlets from a interdyne MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/interdyne.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/interdyne.rsi

