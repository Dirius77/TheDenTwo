- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitCosmohonk
  name: cosmohonk modsuit control
  description: The controller for a cosmohonk model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/cosmohonk.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetCosmohonk
      gloves: ClothingModsuitGauntletsCosmohonk
      outerClothing: ClothingModsuitChestplateCosmohonk
      shoes: ClothingModsuitBootsCosmohonk
  - type: ModuleStorage
    maxBusWidth: 15

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsCosmohonk
  categories: [ HideSpawnMenu ]
  name: cosmohonk modsuit gauntlets
  description: A pair of gauntlets from a cosmohonk MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/cosmohonk.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/cosmohonk.rsi

- type: entity
  parent: ClothingModsuitHelmetBaseExo
  id: ClothingModsuitHelmetCosmohonk
  categories: [ HideSpawnMenu ]
  name: cosmohonk modsuit helmet
  description: A helmet from a cosmohonk MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Head/cosmohonk.rsi
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: SealableClothingVisuals
    clothingVisuals:
      head:
      - state: equipped-HELMET-sealed
      - state: equipped-HELMET-visor
        shader: unshaded
        color: "Red"
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Head/cosmohonk.rsi

- type: entity
  parent: ClothingModsuitChestplateBaseExo
  id: ClothingModsuitChestplateCosmohonk
  categories: [ HideSpawnMenu ]
  name: cosmohonk modsuit chestplate
  description: A chestplate from a cosmohonk MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/OuterClothing/cosmohonk.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/OuterClothing/cosmohonk.rsi

- type: entity
  parent: ClothingModsuitBootsBase
  id: ClothingModsuitBootsCosmohonk
  categories: [ HideSpawnMenu ]
  name: cosmohonk modsuit boots
  description: A pair of boots from a cosmohonk MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Shoes/cosmohonk.rsi
    layers:
    - state: boots
    - state: boots-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Shoes/cosmohonk.rsi
