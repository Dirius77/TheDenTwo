- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitCorpsman
  name: corpsman modsuit control
  description: The controller for a corpsman model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/corpsman.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetCorpsman
      gloves: ClothingModsuitGauntletsCorpsman
      outerClothing: ClothingModsuitChestplateCorpsman
      shoes: ClothingModsuitBootsCorpsman
  - type: ModuleStorage
    maxBusWidth: 15

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsCorpsman
  categories: [ HideSpawnMenu ]
  name: corpsman modsuit gauntlets
  description: A pair of gauntlets from a corpsman MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/corpsman.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/corpsman.rsi

