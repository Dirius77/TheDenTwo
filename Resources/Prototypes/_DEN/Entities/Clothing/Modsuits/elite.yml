- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitElite
  name: elite modsuit control
  description: The controller for a elite model MODsuit. TODO
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Back/elite.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: ToggleableClothing
    requiredSlot:
    - back
    clothingPrototypes:
      head: ClothingModsuitHelmetElite
      gloves: ClothingModsuitGauntletsElite
      outerClothing: ClothingModsuitChestplateElite
      shoes: ClothingModsuitBootsElite
  - type: ModuleStorage
    maxBusWidth: 15

- type: entity
  parent: ClothingModsuitGauntletsBase
  id: ClothingModsuitGauntletsElite
  categories: [ HideSpawnMenu ]
  name: elite modsuit gauntlets
  description: A pair of gauntlets from a elite MODsuit. TODO
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: _DEN/Clothing/Modsuits/Hands/elite.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      shader: unshaded
      map: [ "sealedLayer" ]
  - type: Clothing
    sprite: _DEN/Clothing/Modsuits/Hands/elite.rsi

