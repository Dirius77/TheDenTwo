# Head

- type: marking
  id: SlimeEyesCyclopsPulsing
  bodyPart: Head #used to be Eyes
  groupWhitelist: [Slime]
  coloring:
    default:
      type:
        !type:EyeColoring
        negative: false
  sprites:
  - sprite: _DEN/Mobs/Customization/Slime/cyclopseye.rsi
    state: cyclopspulseeye
  - sprite: _DEN/Mobs/Customization/Slime/cyclopseye.rsi
    state: cyclopspulsering
  # shader: unshaded # don't have marking shaders yet

- type: marking
  id: AnatomicalSkull
  bodyPart: Head
  groupWhitelist: [Slime]
  sprites:
  - sprite: _DEN/Mobs/Customization/Slime/anatomical.rsi
    state: bones-skull

- type: marking
  id: AnatomicalBrain
  bodyPart: Head
  groupWhitelist: [Slime]
  coloring:
    default:
      type:
        !type:SimpleColoring
          color: "#c08f7b"
  sprites:
  - sprite: _DEN/Mobs/Customization/Slime/anatomical.rsi
    state: organ-brain
  
