  name: pastry dough
  description: A buttery, rolled out pastry dough.
  components:
  - type: Sprite
    sprite: _NF/Objects/Consumable/Food/ingredients.rsi
    state: dough-pastry-flat
  - type: Construction
    graph: Pizza
    node: pastry
  - type: ToolRefinable # DEN - butchery refactor
    refineResult:
    - id: FoodDoughPastryBaseRaw
      amount: 6
  - type: Solution # DEN: Updated solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 60
      - ReagentId: Butter
        Quantity: 15
