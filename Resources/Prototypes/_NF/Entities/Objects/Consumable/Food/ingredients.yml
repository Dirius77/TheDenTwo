- type: entity
  parent: FoodDoughFlat
  id: FoodDoughFlatButtered
  name: buttered flat dough
  description: A buttered, flattened dough.
  components:
  - type: FlavorProfile
    flavors:
    - dough
    - butter
  - type: Sprite
    sprite: _NF/Objects/Consumable/Food/ingredients.rsi
    state: dough-flat-buttered
  - type: Construction
    graph: Pizza
    node: flat-butter
  - type: Solution # DEN: Updated solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 60
      - ReagentId: Butter
        Quantity: 15

- type: entity
  parent: [FoodDoughFlat, BaseSlicingRefinableFood] # DEN - butchery refactor
