# Canes
# The white cane is intentionally not included here. That's for the blind.
- type: loadout
  id: OffsetCane
  storage:
    back:
    - OffsetCane
  groupBy: "canes"

- type: loadout
  id: OffsetCaneWood
  storage:
    back:
    - OffsetCaneWood
  groupBy: "canes"

- type: loadout
  id: OffsetCaneClown
  effects:
  # Begin DEN: Use PlayerRequirements
  - !type:PlayerRequirementLoadoutEffect
    requirement: !type:PlayerJobPlaytimeRequirement
      job: Clown
      minTime: 1h
      requirementType: Loadout
  # - !type:JobRequirementLoadoutEffect
  #   requirement:
  #     !type:RoleTimeRequirement
  #     role: JobClown
  #     time: 1h
  # End DEN
  storage:
    back:
    - OffsetCaneClown
  groupBy: "canes"

- type: loadout
  id: OffsetCaneMime
  effects:
  # Begin DEN: Use PlayerRequirements
  - !type:PlayerRequirementLoadoutEffect
    requirement: !type:PlayerJobPlaytimeRequirement
      job: Mime
      minTime: 1h
      requirementType: Loadout
  # - !type:JobRequirementLoadoutEffect
  #   requirement:
  #     !type:RoleTimeRequirement
  #     role: JobMime
  #     time: 1h
  # End DEN
  storage:
    back:
    - OffsetCaneMime
  groupBy: "canes"

- type: loadout
  id: OffsetCaneNT
  effects:
  # Begin DEN: Use PlayerRequirements
  - !type:PlayerRequirementLoadoutEffect
    requirement: !type:PlayerDepartmentPlaytimeRequirement
      department: Command
      minTime: 5h
      requirementType: Loadout
  # - !type:JobRequirementLoadoutEffect
  #   requirement:
  #     !type:DepartmentTimeRequirement
  #     department: Command
  #     time: 5h
  # End DEN
  storage:
    back:
    - OffsetCaneNT
  groupBy: "canes"

- type: loadout
  id: Cane
  effects:
  # Begin DEN: Use PlayerRequirements
  - !type:PlayerRequirementLoadoutEffect
    requirement: !type:PlayerJobPlaytimeRequirement
      job: Librarian
      minTime: 1h
      requirementType: Loadout
  # - !type:JobRequirementLoadoutEffect
  #   requirement:
  #     !type:RoleTimeRequirement
  #     role: JobLibrarian
  #     time: 1h # same as Jamjar.
  # End DEN
  storage:
    back:
    - Cane
  groupBy: "canes"
